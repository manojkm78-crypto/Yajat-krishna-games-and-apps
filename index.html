<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yajat Krishna Games & Apps</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0a0f;--surface:#14141a;--card:#1a1a22;--accent:#ff5e1a;--text:#f0f0f0;--text2:#b0b0b0;--border:#2a2a35;--radius:16px}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        #splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#1a1025,#0a0a14,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
        #splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
        .s-logo{width:100px;height:100px;background:linear-gradient(135deg,#ff5e1a,#e04000);border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:50px;animation:pulse 1.2s infinite;box-shadow:0 0 50px rgba(255,94,26,.5);margin-bottom:18px}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
        .s-title{font-size:1.7rem;font-weight:700;color:#fff;text-align:center}
        .s-sub{font-size:.85rem;color:#aaa;margin-top:5px}
        .s-bar{margin-top:28px;width:55px;height:4px;background:#333;border-radius:4px;overflow:hidden}
        .s-bar-f{height:100%;background:var(--accent);animation:lb 5s ease forwards;width:0%}
        @keyframes lb{to{width:100%}}
        #app{display:none;min-height:100vh}
        #app.show{display:block;animation:fi .5s}
        @keyframes fi{from{opacity:0}to{opacity:1}}
        .header{background:var(--surface);padding:12px 16px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .h-logo{width:38px;height:38px;background:linear-gradient(135deg,#ff5e1a,#e04000);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
        .h-brand{font-weight:700;font-size:.9rem;color:#fff;white-space:nowrap}
        .search-wrap{flex:1;position:relative;min-width:140px}
        .search-wrap input{width:100%;padding:10px 14px 10px 36px;border-radius:50px;border:1.5px solid var(--border);background:#222;color:#fff;font-size:.85rem;outline:none}
        .search-wrap input:focus{border-color:var(--accent)}
        .search-wrap .s-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:1rem;color:#888}
        .main{padding:16px;max-width:900px;margin:0 auto}
        .sec-title{font-size:1.2rem;font-weight:700;margin-bottom:14px;color:#fff}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
        .card{background:var(--card);border-radius:var(--radius);padding:14px;cursor:pointer;transition:.3s;border:1px solid transparent;text-align:center}
        .card:hover{border-color:var(--border);transform:translateY(-3px);box-shadow:0 8px 25px rgba(0,0,0,.5)}
        .card-icon{width:56px;height:56px;border-radius:14px;object-fit:cover;margin:0 auto 8px;background:#2a2a30}
        .card-icon-ph{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#2a2a30,#333);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 8px}
        .card-name{font-weight:600;font-size:.82rem;color:#fff;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .card-meta{font-size:.68rem;color:#888;margin-top:4px}
        .empty{text-align:center;padding:60px 20px;color:#666}
        .empty .icon{font-size:60px;margin-bottom:12px}
        .overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:.35s}
        .overlay.active{opacity:1;visibility:visible}
        .modal{background:var(--surface);border-radius:var(--radius);padding:22px 18px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;border:1px solid var(--border);position:relative}
        .modal h2{font-size:1.2rem;margin-bottom:14px;color:#fff}
        .modal .close{position:absolute;top:10px;right:14px;background:none;border:none;color:#888;font-size:1.3rem;cursor:pointer}
        .form-g{margin-bottom:12px}
        .form-g label{display:block;font-weight:600;font-size:.8rem;margin-bottom:5px;color:#ccc}
        .form-g input[type=text],.form-g textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:#222;color:#fff;font-size:.85rem;font-family:inherit;outline:none;resize:vertical}
        .form-g textarea{min-height:60px}
        .file-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#222;border:1.5px dashed var(--border);border-radius:10px;cursor:pointer;transition:.3s;color:#ccc;font-size:.82rem;justify-content:center}
        .file-btn:hover{border-color:var(--accent);color:#fff}
        .file-btn.sel{border-color:#4caf84;border-style:solid;color:#4caf84}
        .file-hidden{display:none}
        .btn-row{display:flex;gap:8px;margin-top:16px}
        .btn{flex:1;padding:11px;border-radius:50px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;text-align:center;transition:.3s}
        .btn-p{background:var(--accent);color:#fff}
        .btn-p:hover{background:#ff7b45}
        .btn-p:disabled{background:#666;cursor:not-allowed}
        .btn-s{background:#2a2a30;color:#ccc;border:1px solid var(--border)}
        .btn-s:hover{background:#333;color:#fff}
        .detail-icon{width:70px;height:70px;border-radius:18px;object-fit:cover;margin:0 auto 12px}
        .detail-icon-ph{width:70px;height:70px;border-radius:18px;background:linear-gradient(135deg,#2a2a30,#333);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
        .detail-name{font-size:1.1rem;font-weight:700;color:#fff;text-align:center;margin-bottom:4px}
        .detail-desc{font-size:.8rem;color:#aaa;text-align:center;margin-bottom:14px}
        .detail-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
        .btn-dl{background:#4caf50;color:#fff;padding:10px 18px;border-radius:50px;font-weight:600;border:none;cursor:pointer;font-size:.85rem;transition:.3s}
        .btn-dl:hover{background:#5cbf62}
        .btn-sh{background:#2a2a30;color:#ccc;padding:10px 16px;border-radius:50px;font-weight:600;border:1px solid var(--border);cursor:pointer;font-size:.85rem;transition:.3s}
        .btn-sh:hover{background:#333;color:#fff}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#333;color:#fff;padding:12px 20px;border-radius:50px;font-size:.8rem;z-index:500;transition:transform .4s cubic-bezier(.175,.885,.32,1.275);pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .toast.ok{background:#2e7d32}
        .toast.err{background:#d32f2f}
        @media(min-width:500px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}}
    </style>
</head>
<body>
    <!-- SPLASH -->
    <div id="splash">
        <div class="s-logo">🎮</div>
        <div class="s-title">Yajat Krishna</div>
        <div class="s-sub">Games & Apps</div>
        <div class="s-bar"><div class="s-bar-f"></div></div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <div class="header">
            <div class="h-logo">🎮</div>
            <span class="h-brand">Yajat Krishna</span>
            <div class="search-wrap">
                <span class="s-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search apps...">
            </div>
        </div>
        <div class="main">
            <div class="sec-title">📱 Apps & Games</div>
            <div class="grid" id="appGrid"></div>
            <div class="empty" id="emptyState"><div class="icon">📦</div><p>No apps yet</p></div>
        </div>
    </div>

    <!-- UPLOAD OVERLAY -->
    <div class="overlay" id="uploadOverlay">
        <div class="modal">
            <button class="close" id="closeUpload">✕</button>
            <h2>📤 Upload APK</h2>
            <div class="form-g"><label>App Name *</label><input type="text" id="uName" placeholder="My Game" maxlength="80"></div>
            <div class="form-g"><label>Description</label><textarea id="uDesc" placeholder="Description..." maxlength="300"></textarea></div>
            <div class="form-g"><label>File Size (e.g., 25 MB)</label><input type="text" id="uSize" placeholder="25 MB" maxlength="20"></div>
            <div class="form-g"><label>Icon Image</label><div class="file-btn" id="iconBtn">📷 Choose Icon</div><input type="file" class="file-hidden" id="iconFile" accept="image/*"></div>
            <div class="form-g"><label>APK File *</label><div class="file-btn" id="apkBtn">📁 Choose APK</div><input type="file" class="file-hidden" id="apkFile" accept=".apk"></div>
            <div class="btn-row">
                <button class="btn btn-s" id="cancelUpload">Cancel</button>
                <button class="btn btn-p" id="submitUpload">🚀 Upload</button>
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div class="overlay" id="detailOverlay">
        <div class="modal" style="text-align:center">
            <button class="close" id="closeDetail">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        (function(){
            const REPO_OWNER = 'manojkm78-crypto';
            const REPO_NAME = 'Yajat-krishna-games-and-apps';
            const GITHUB_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
            const RAW_URL = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/`;
            const BACKEND_URL = 'https://yajat-app-store.vercel.app'; // Will update after deployment
            const ADMIN_EMAIL = 'yajatkrishna24@gmail.com';

            let appsData = [];

            const splash = document.getElementById('splash');
            const mainApp = document.getElementById('app');
            const searchInput = document.getElementById('searchInput');
            const appGrid = document.getElementById('appGrid');
            const emptyState = document.getElementById('emptyState');
            const uploadOverlay = document.getElementById('uploadOverlay');
            const detailOverlay = document.getElementById('detailOverlay');
            const detailContent = document.getElementById('detailContent');
            const toast = document.getElementById('toast');

            let toastTimer;
            function showToast(msg, ok){
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'toast ' + (ok ? 'ok' : 'err') + ' show';
                toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            }

            // Load apps from GitHub
            async function loadApps(){
                try {
                    const resp = await fetch(GITHUB_API + 'apps/info.json');
                    if(!resp.ok) throw new Error('No apps file');
                    const data = await resp.json();
                    const content = atob(data.content);
                    appsData = JSON.parse(content);
                    renderApps();
                } catch(e) {
                    console.log('No apps found');
                    appsData = [];
                    renderApps();
                }
            }

            function renderApps(filter = ''){
                const q = filter.toLowerCase().trim();
                let filtered = appsData;
                if(q){
                    filtered = appsData.filter(a => a.name.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q));
                }
                appGrid.innerHTML = '';
                if(filtered.length === 0){
                    emptyState.style.display = 'block';
                    appGrid.style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    appGrid.style.display = 'grid';
                    filtered.forEach((app) => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => showDetail(app);
                        const iconURL = app.iconFile ? (RAW_URL + 'icons/' + app.iconFile) : null;
                        card.innerHTML = `
                            ${iconURL ? `<img class="card-icon" src="${iconURL}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"><div class="card-icon-ph" style="display:none">📱</div>` : '<div class="card-icon-ph">📱</div>'}
                            <div class="card-name">${esc(app.name)}</div>
                            <div class="card-meta">${esc(app.fileSize||'')}</div>
                        `;
                        appGrid.appendChild(card);
                    });
                }
            }

            function showDetail(app){
                const iconURL = app.iconFile ? (RAW_URL + 'icons/' + app.iconFile) : null;
                detailContent.innerHTML = `
                    ${iconURL ? `<img class="detail-icon" src="${iconURL}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"><div class="detail-icon-ph" style="display:none">📱</div>` : '<div class="detail-icon-ph">📱</div>'}
                    <div class="detail-name">${esc(app.name)}</div>
                    <div class="detail-desc">${esc(app.description||'No description')}</div>
                    <div class="detail-btns">
                        <button class="btn-dl" onclick="downloadApp('${app.apkFile}')">⬇️ Download</button>
                        <button class="btn-sh" onclick="shareApp('${app.name}','${app.apkFile}')">🔗 Share</button>
                    </div>
                `;
                detailOverlay.classList.add('active');
            }

            window.downloadApp = function(apkFile){
                const url = RAW_URL + 'apps/' + apkFile;
                window.open(url, '_blank');
                showToast('Download started! 🎉', true);
            };

            window.shareApp = function(name, apkFile){
                const url = RAW_URL + 'apps/' + apkFile;
                if(navigator.share){
                    navigator.share({title:name, text:'Download ' + name, url:url}).catch(() => copyLink(url));
                } else {
                    copyLink(url);
                }
            };

            function copyLink(url){
                if(navigator.clipboard){
                    navigator.clipboard.writeText(url).then(() => showToast('Link copied! 📋', true)).catch(() => prompt('Share link:', url));
                } else {
                    prompt('Share link:', url);
                }
            }

            function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

            // Splash
            setTimeout(() => {
                splash.classList.add('hidden');
                mainApp.classList.add('show');
                loadApps();
            }, 5000);

            // Search
            searchInput.addEventListener('input', () => {
                const q = searchInput.value;
                if(q.trim().toLowerCase() === ADMIN_EMAIL){
                    uploadOverlay.classList.add('active');
                    searchInput.value = '';
                    return;
                }
                renderApps(q);
            });

            // Upload overlay
            document.getElementById('closeUpload').onclick = () => uploadOverlay.classList.remove('active');
            document.getElementById('cancelUpload').onclick = () => uploadOverlay.classList.remove('active');
            uploadOverlay.addEventListener('click', function(e){ if(e.target === uploadOverlay) uploadOverlay.classList.remove('active'); });

            let selectedIcon = null, selectedApk = null;
            document.getElementById('iconBtn').onclick = () => document.getElementById('iconFile').click();
            document.getElementById('iconFile').onchange = function(){
                selectedIcon = this.files[0];
                const btn = document.getElementById('iconBtn');
                btn.textContent = selectedIcon ? '✅ ' + selectedIcon.name : '📷 Choose Icon';
                btn.classList.toggle('sel', !!selectedIcon);
            };
            document.getElementById('apkBtn').onclick = () => document.getElementById('apkFile').click();
            document.getElementById('apkFile').onchange = function(){
                selectedApk = this.files[0];
                const btn = document.getElementById('apkBtn');
                btn.textContent = selectedApk ? '✅ ' + selectedApk.name : '📁 Choose APK';
                btn.classList.toggle('sel', !!selectedApk);
            };

            document.getElementById('submitUpload').onclick = async function(){
                const name = document.getElementById('uName').value.trim();
                const desc = document.getElementById('uDesc').value.trim();
                const fileSize = document.getElementById('uSize').value.trim();
                
                if(!name){ showToast('Enter app name!'); return; }
                if(!selectedApk){ showToast('Select APK file!'); return; }
                
                const btn = document.getElementById('submitUpload');
                btn.disabled = true;
                btn.textContent = 'Uploading...';
                
                try {
                    const formData = new FormData();
                    formData.append('name', name);
                    formData.append('description', desc);
                    formData.append('fileSize', fileSize);
                    formData.append('email', ADMIN_EMAIL);
                    formData.append('apk', selectedApk);
                    if(selectedIcon) formData.append('icon', selectedIcon);

                    const resp = await fetch(BACKEND_URL + '/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await resp.json();
                    
                    if(!resp.ok) throw new Error(result.error || 'Upload failed');

                    showToast('✅ App uploaded successfully!', true);
                    
                    // Reset form
                    document.getElementById('uName').value = '';
                    document.getElementById('uDesc').value = '';
                    document.getElementById('uSize').value = '';
                    selectedIcon = null; selectedApk = null;
                    document.getElementById('iconBtn').textContent = '📷 Choose Icon';
                    document.getElementById('iconBtn').classList.remove('sel');
                    document.getElementById('apkBtn').textContent = '📁 Choose APK';
                    document.getElementById('apkBtn').classList.remove('sel');
                    document.getElementById('iconFile').value = '';
                    document.getElementById('apkFile').value = '';
                    
                    uploadOverlay.classList.remove('active');
                    
                    // Reload apps
                    setTimeout(() => loadApps(), 2000);
                } catch(e){
                    showToast('Error: ' + e.message);
                }
                btn.disabled = false;
                btn.textContent = '🚀 Upload';
            };

            // Detail modal
            document.getElementById('closeDetail').onclick = () => detailOverlay.classList.remove('active');
            detailOverlay.addEventListener('click', function(e){ if(e.target === detailOverlay) detailOverlay.classList.remove('active'); });
        })();
    </script>
</body>
</html>
